services:
  - type: web
    name: muhurta-trading
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENGINE_REPO
        sync: false
      - key: ENGINE_REF
        value: main
      - key: ENGINE_DIR
        sync: false
      - key: ENGINE_TOKEN
        sync: false
      - key: APP_KEY
        sync: false
      - key: GEBURT
        sync: false
      - key: GEBURT_ORT
        sync: false
      - key: APP_ORT
        value: Wädenswil, Schweiz
